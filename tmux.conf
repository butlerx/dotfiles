# pets: package=tmux
# pets: symlink=~/.tmux.conf

# Match Neovim's sickill/vim-monokai palette. Current and alert states also
# use bold text and background changes, so hue is not the only signal.
set -g status-style "fg=#F8F8F2,bg=#272822"

# tmux 3.8 detects this client as light even though it is displaying a dark
# terminal. Pin its built-in chooser/copy-mode UI to the Monokai dark palette.
set -s theme dark
set -s dark-theme-black "#272822"
set -s dark-theme-white "#F8F8F2"
set -s dark-theme-light-grey "#F8F8F2"
set -s dark-theme-dark-grey "#3C3D37"
set -s dark-theme-green "#A6E22E"
set -s dark-theme-yellow "#E6DB74"
set -s dark-theme-red "#F92672"
set -s dark-theme-blue "#66D9EF"
set -s dark-theme-cyan "#66D9EF"
set -s dark-theme-magenta "#AE81FF"

set-option -g history-limit 30000
set-option -g lock-command vlock

# set window split
bind-key v split-window -h
bind-key b split-window

# Window titles: inactive = muted grey, activity = yellow + bold, current =
# cyan background + bold. Each state remains distinct without hue alone.
setw -g window-status-style "fg=#90908A,bg=#272822"
setw -g window-status-activity-style "fg=#E6DB74,bg=#272822,bold"
setw -g window-status-current-style "fg=#272822,bg=#66D9EF,bold"
setw -g window-status-last-style "fg=#AE81FF,bg=#272822,bold"

# Use a full-width Monokai yellow selection bar in choose-tree and menus.
setw -g mode-style "fg=#272822,bg=#E6DB74,bold"
set -g menu-style "fg=#F8F8F2,bg=#3C3D37"
set -g menu-selected-style "fg=#272822,bg=#E6DB74,bold"

# Pane borders match Neovim's VertSplit and Identifier colours.
set -g pane-border-style "fg=#64645E"
set -g pane-active-border-style "fg=#66D9EF"

# Messages use Neovim's Visual selection background.
set -g message-style "fg=#F8F8F2,bg=#49483E,bold"
set -g message-command-style "fg=#F8F8F2,bg=#49483E,bold"

# Pane numbers and clock use Monokai cyan and yellow.
set -g display-panes-active-colour "#66D9EF"
set -g display-panes-colour "#E6DB74"
setw -g clock-mode-colour "#66D9EF"

# Restore Previous tmux
set -g @continuum-restore 'on'

# Status bar
set -g status-interval 1
set -g status-justify "centre"
set -g status-left "#[fg=#272822,bg=#A6E22E,bold] #S #[fg=#A6E22E,bg=#3C3D37,nobold]#[fg=#F8F8F2,bg=#3C3D37] #(whoami) #[fg=#3C3D37,bg=#272822]"
set -g status-left-length "100"
set -g status-right "#[fg=#3C3D37,bg=#272822]#[fg=#F8F8F2,bg=#3C3D37] #(~/.dotfiles/tmux/tmux_mem_cpu_load)  #(~/.dotfiles/tmux/uptime.sh)  %R  %Y-%m-%d #[fg=#FD971F,bg=#3C3D37]#[fg=#272822,bg=#FD971F,bold] #H "
set -g status-right-length "100"
# Preserve Powerline segments in the window list. Current windows use Monokai
# cyan; activity uses yellow plus bold text and the tmux flag marker.
setw -g window-status-current-format "#[fg=#272822,bg=#66D9EF]#[fg=#272822,bg=#66D9EF,bold] #I#F  #W #[fg=#66D9EF,bg=#272822,nobold]"
setw -g window-status-format "#[fg=#272822,bg=#3C3D37]#[default,bg=#3C3D37] #I#F  #W #[fg=#3C3D37,bg=#272822,nobold]"
setw -g window-status-separator ""

# C-b is not acceptable -- Vim uses it
set-option -g prefix C-a
bind-key C-a last-window

# Start numbering at 1
set -g base-index 1

# Allows for faster key repetition
set -s escape-time 0

# Allows us to use C-a a <command> to send commands to a TMUX session inside another TMUX session
bind-key a send-prefix

# Allow for extended keys (like C-left, C-right, etc.)
set -g extended-keys on
set -g extended-keys-format csi-u

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity on

# Vi copypaste mode
set -g @shell_mode 'vi'
set-window-option -g mode-keys vi
bind-key -Tcopy-mode-vi 'v' send -X begin-selection
bind-key -Tcopy-mode-vi 'y' send -X copy-selection

# hjkl pane traversal
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# set to main-horizontal, 60% height for main pane
bind m set-window-option main-pane-height 60\; select-layout main-horizontal

# Name new Window on creation
bind-key C command-prompt -p "Name of new window: " "new-window -n '%%'"

# reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."

# auto window rename
set-window-option -g automatic-rename

# color
set -g default-terminal "screen-256color"
set-option -sa terminal-overrides ',256:RGB'

# Reload vim
set -g @resurrect-strategy-nvim 'session'

run-shell "tmux set-environment -g TMUX_VERSION_MAJOR $(tmux -V | cut -d' ' -f2 | cut -d'.' -f1 | sed 's/[^0-9]*//g')"
run-shell "tmux set-environment -g TMUX_VERSION_MINOR $(tmux -V | cut -d' ' -f2 | cut -d'.' -f2 | sed 's/[^0-9]*//g')"

# Mouse on (wheel scrolling)
if-shell '\( #{$TMUX_VERSION_MAJOR} -eq 2 -a #{$TMUX_VERSION_MINOR} -ge 1\) -o #{$TMUX_VERSION_MAJOR} -gt 2' 'set -g mouse on'
if-shell '\( #{$TMUX_VERSION_MAJOR} -eq 2 -a #{$TMUX_VERSION_MINOR} -lt 1\) -o #{$TMUX_VERSION_MAJOR} -le 1' 'set -g mode-mouse off'

# fix pane_current_path on new window and splits
if-shell "#{$TMUX_VERSION_MAJOR} -gt 1 -o \( #{$TMUX_VERSION_MAJOR} -eq 1 -a #{$TMUX_VERSION_MINOR} -ge 8 \)" 'unbind c; bind c new-window -c "#{pane_current_path}"'
if-shell "#{$TMUX_VERSION_MAJOR} -gt 1 -o \( #{$TMUX_VERSION_MAJOR} -eq 1 -a #{$TMUX_VERSION_MINOR} -ge 8 \)" "unbind '\"'; bind '\"' split-window -v -c '#{pane_current_path}'"
if-shell "#{$TMUX_VERSION_MAJOR} -gt 1 -o \( #{$TMUX_VERSION_MAJOR} -eq 1 -a #{$TMUX_VERSION_MINOR} -ge 8 \)" 'unbind v; bind v split-window -h -c "#{pane_current_path}"'
if-shell "#{$TMUX_VERSION_MAJOR} -gt 1 -o \( #{$TMUX_VERSION_MAJOR} -eq 1 -a #{$TMUX_VERSION_MINOR} -ge 8 \)" 'unbind %; bind % split-window -h -c "#{pane_current_path}"'

# Passthrough, clipboard, focus events, truecolor
set -g allow-passthrough on
set -g set-clipboard on
set -g focus-events on
set -as terminal-features ',*:RGB'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
