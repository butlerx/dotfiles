# pets: package=tmux
# pets: symlink=~/.tmux.conf

# High-contrast, colour-blind-friendly palette (Okabe-Ito inspired).
# Current and alert states also use bold/background changes, so hue is not the
# only signal.
set -g status-style "fg=#F2F2F2,bg=#1B1B1B"

# tmux 3.8 detects this client as light even though it is displaying a dark
# terminal. Pin the built-in chooser/copy-mode theme and replace red/green
# state colours with an accessible, high-contrast palette.
set -s theme dark
set -s dark-theme-black "#111111"
set -s dark-theme-white "#F2F2F2"
set -s dark-theme-light-grey "#D0D0D0"
set -s dark-theme-dark-grey "#303030"
set -s dark-theme-green "#00C98D"
set -s dark-theme-yellow "#F0E442"
set -s dark-theme-red "#E69F00"
set -s dark-theme-blue "#56B4E9"
set -s dark-theme-cyan "#00D6D6"
set -s dark-theme-magenta "#CC79A7"

set-option -g history-limit 30000
set-option -g lock-command vlock

# set window split
bind-key v split-window -h
bind-key b split-window

# Window titles: inactive = grey, activity = yellow + bold, current = blue
# background + bold. This keeps every state distinct without red/green cues.
setw -g window-status-style "fg=#B3B3B3,bg=#1B1B1B"
setw -g window-status-activity-style "fg=#F0E442,bg=#1B1B1B,bold"
setw -g window-status-current-style "fg=#111111,bg=#56B4E9,bold"
setw -g window-status-last-style "fg=#CC79A7,bg=#1B1B1B,bold"

# Ctrl-a s (choose-tree) and popup menus need explicit colours. tmux 3.8's
# theme colour aliases have poor contrast with the current terminal palette.
# Use a full-width white selection bar so the current tree row is obvious
# without relying on hue.
setw -g mode-style "fg=#000000,bg=#FFFFFF,bold"
set -g menu-style "fg=#F2F2F2,bg=#303030"
set -g menu-selected-style "fg=#000000,bg=#FFFFFF,bold"

# Pane borders use both brightness and colour to mark focus.
set -g pane-border-style "fg=#4D4D4D"
set -g pane-active-border-style "fg=#56B4E9"

# Messages use a solid, high-contrast block.
set -g message-style "fg=#FFFFFF,bg=#005F87,bold"
set -g message-command-style "fg=#FFFFFF,bg=#005F87,bold"

# Pane numbers and clock avoid red/green state distinctions.
set -g display-panes-active-colour "#56B4E9"
set -g display-panes-colour "#F0E442"
setw -g clock-mode-colour "#56B4E9"

# Restore Previous tmux
set -g @continuum-restore 'on'

# Status bar
set -g status-interval 1
set -g status-justify "centre"
set -g status-left "#[fg=#111111,bg=#56B4E9,bold] #S #[fg=#56B4E9,bg=#303030,nobold]#[fg=#F2F2F2,bg=#303030] #(whoami) #[fg=#303030,bg=#1B1B1B]"
set -g status-left-length "100"
set -g status-right "#[fg=#303030,bg=#1B1B1B]#[fg=#F2F2F2,bg=#303030] #(~/.dotfiles/tmux/tmux_mem_cpu_load)  #(~/.dotfiles/tmux/uptime.sh)  %R  %Y-%m-%d #[fg=#E69F00,bg=#303030]#[fg=#111111,bg=#E69F00,bold] #H "
set -g status-right-length "100"
# Preserve Powerline segments in the window list. Current windows use a blue
# block; activity uses a yellow block plus bold text and the tmux flag marker.
setw -g window-status-current-format "#[fg=#1B1B1B,bg=#56B4E9]#[fg=#111111,bg=#56B4E9,bold] #I#F  #W #[fg=#56B4E9,bg=#1B1B1B,nobold]"
setw -g window-status-format "#[fg=#1B1B1B,bg=#303030]#[default,bg=#303030] #I#F  #W #[fg=#303030,bg=#1B1B1B,nobold]"
setw -g window-status-separator ""

# C-b is not acceptable -- Vim uses it
set-option -g prefix C-a
bind-key C-a last-window

# Start numbering at 1
set -g base-index 1

# Allows for faster key repetition
set -s escape-time 0

# Allows us to use C-a a <command> to send commands to a TMUX session inside another TMUX session
bind-key a send-prefix

# Allow for extended keys (like C-left, C-right, etc.)
set -g extended-keys on
set -g extended-keys-format csi-u

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity on

# Vi copypaste mode
set -g @shell_mode 'vi'
set-window-option -g mode-keys vi
bind-key -Tcopy-mode-vi 'v' send -X begin-selection
bind-key -Tcopy-mode-vi 'y' send -X copy-selection

# hjkl pane traversal
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# set to main-horizontal, 60% height for main pane
bind m set-window-option main-pane-height 60\; select-layout main-horizontal

# Name new Window on creation
bind-key C command-prompt -p "Name of new window: " "new-window -n '%%'"

# reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."

# auto window rename
set-window-option -g automatic-rename

# color
set -g default-terminal "screen-256color"
set-option -sa terminal-overrides ',256:RGB'

# Reload vim
set -g @resurrect-strategy-nvim 'session'

run-shell "tmux set-environment -g TMUX_VERSION_MAJOR $(tmux -V | cut -d' ' -f2 | cut -d'.' -f1 | sed 's/[^0-9]*//g')"
run-shell "tmux set-environment -g TMUX_VERSION_MINOR $(tmux -V | cut -d' ' -f2 | cut -d'.' -f2 | sed 's/[^0-9]*//g')"

# Mouse on (wheel scrolling)
if-shell '\( #{$TMUX_VERSION_MAJOR} -eq 2 -a #{$TMUX_VERSION_MINOR} -ge 1\) -o #{$TMUX_VERSION_MAJOR} -gt 2' 'set -g mouse on'
if-shell '\( #{$TMUX_VERSION_MAJOR} -eq 2 -a #{$TMUX_VERSION_MINOR} -lt 1\) -o #{$TMUX_VERSION_MAJOR} -le 1' 'set -g mode-mouse off'

# fix pane_current_path on new window and splits
if-shell "#{$TMUX_VERSION_MAJOR} -gt 1 -o \( #{$TMUX_VERSION_MAJOR} -eq 1 -a #{$TMUX_VERSION_MINOR} -ge 8 \)" 'unbind c; bind c new-window -c "#{pane_current_path}"'
if-shell "#{$TMUX_VERSION_MAJOR} -gt 1 -o \( #{$TMUX_VERSION_MAJOR} -eq 1 -a #{$TMUX_VERSION_MINOR} -ge 8 \)" "unbind '\"'; bind '\"' split-window -v -c '#{pane_current_path}'"
if-shell "#{$TMUX_VERSION_MAJOR} -gt 1 -o \( #{$TMUX_VERSION_MAJOR} -eq 1 -a #{$TMUX_VERSION_MINOR} -ge 8 \)" 'unbind v; bind v split-window -h -c "#{pane_current_path}"'
if-shell "#{$TMUX_VERSION_MAJOR} -gt 1 -o \( #{$TMUX_VERSION_MAJOR} -eq 1 -a #{$TMUX_VERSION_MINOR} -ge 8 \)" 'unbind %; bind % split-window -h -c "#{pane_current_path}"'

# Passthrough, clipboard, focus events, truecolor
set -g allow-passthrough on
set -g set-clipboard on
set -g focus-events on
set -as terminal-features ',*:RGB'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
